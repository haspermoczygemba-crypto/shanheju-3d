<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Codex 原生界面</title><link rel="stylesheet" href="/projection/assets/projection.css?v=20261005-zoom1"></head><body>
<header><strong>Codex 原生界面</strong><span id="status" role="status">正在读取状态…</span><div class="actions"><button id="start" disabled>连接原生界面</button><button id="retry-status">重新读取</button><button id="focus" disabled>显示电脑窗口</button><button id="stop" disabled>断开投影</button><button id="fullscreen">全屏</button><div class="zoom-controls" role="group" aria-label="画面缩放"><button id="zoom-out" disabled aria-label="缩小画面">−</button><output id="zoom-value" aria-label="画面缩放百分比">适应屏幕</output><button id="zoom-in" disabled aria-label="放大画面">＋</button><button id="zoom-reset" disabled>100%</button><button id="zoom-fit" disabled>适应屏幕</button></div></div></header>
<main id="screen" aria-label="电脑上的原生 Codex 应用画面"></main>
<section id="input-panel"><label for="input-text">平板中文 / 文本输入（先点原生界面的输入框）</label><div class="input-row"><textarea id="input-text" rows="2" maxlength="8000" placeholder="在平板键盘中输入，再插入电脑当前光标；不会自动发送任务"></textarea><button id="insert" disabled>插入文本<br>不发送任务</button></div><div class="key-actions"><button data-key="tab" disabled>Tab</button><button data-key="backspace" disabled>退格</button><button data-key="escape" disabled>Esc</button><label><input id="view-only" type="checkbox">只看画面</label><label><input id="fit" type="checkbox" checked>适应屏幕</label><label><input id="pan-mode" type="checkbox">拖动画面（不点击电脑）</label><span class="zoom-help">双指捏合缩放 · 放大后双指平移</span></div></section>
<footer><span>电脑运行 Codex 与模型请求，平板只传画面和操作。关闭投影不会停止任务。</span><span id="network">同源私网连接 · 不访问模型接口</span></footer>
<noscript>投影页面需要浏览器启用 JavaScript；请用 Chrome 或 Edge 打开同舟。</noscript>
<script defer src="/projection/assets/projection.js?v=20261005-zoom1"></script></body></html>
